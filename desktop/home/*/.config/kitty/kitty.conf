env               TERM=xterm-256color
font_family       family="JetBrainsMonoNL Nerd Font"
symbol_map        U+E000-U+E00A Noto Emoji
font_size         11.0
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_features     none
disable_ligatures always

foreground             #fff
background             #000
background_blur        1
background_image       none
background_opacity     0.33
cursor                 #fff
cursor_blink_interval  -1
cursor_shape           block
cursor_shape_unfocused hollow
cursor_text_color      #000
cursor_trail           0
cursor_trail_color     none
mouse_hide_wait        1.0
selection_background   #fff
selection_foreground   #000

enable_audio_bell    no
visual_bell_color    #eee # @theme:foreground@
visual_bell_duration 0.1

scrollback_lines              10000
scrollbar                     never
scrollbar_handle_opacity      0
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0

detect_urls          yes
url_color            #1793d1 # @theme:accent@
url_style            dashed
underline_hyperlinks hover

active_border_color         #fff
inactive_border_color       #000
placement_strategy          center
remember_window_position    no
remember_window_size        no
single_window_margin_width  -1
single_window_padding_width -1
window_margin_width         2
window_padding_width        2
tab_bar_style               hidden

allow_remote_control  no
strip_trailing_spaces always
notify_on_cmd_finish  unfocused 1.0
paste_actions         replace-dangerous-control-codes,confirm-if-large
shell_integration     enabled no-cursor

map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
copy_on_select    clipboard
clipboard_control write-clipboard read-clipboard

close_on_child_death    yes
confirm_os_window_close 0
