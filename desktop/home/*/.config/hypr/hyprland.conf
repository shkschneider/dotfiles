# ~/.config/hypr/hyprland.conf

monitor=,preferred,auto,auto

env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = XDG_CURRENT_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, gtk3 # qt6-base || hyprqt6engine
#env = MOZ_ENABLE_WAYLAND, 1
#env = SDL_VIDEODRIVER, wayland
#env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
#env = _JAVA_AWT_WM_NONREPARENTING, 1
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = dbus-update-activation-environment --systemd --all

general {
    resize_on_border = false
    allow_tearing = false
    layout = dwindle # master
}
dwindle {
    pseudotile = true
    preserve_split = true # you probably want this
    use_active_for_splits = true # not mouse
}
master {
    new_status = master
}

cursor {
    hotspot_padding = 2
    inactive_timeout = 6
    hide_on_key_press = true
    no_hardware_cursors = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true # :(
    font_family = JetBrains Mono NL
    splash_font_family = JetBrains Mono
    mouse_move_enables_dpms = false
    key_press_enables_dpms = true
    allow_session_lock_restore = true # red screen of death
    close_special_on_empty = true
}

input {
    #kb_layout = us
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
debug {
    #overlay = true
}

source = ~/.config/hypr/_*.conf

