<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias>
        <family>symbols</family>
        <prefer>
            <!-- @theme@ -->
            <family>Symbols Nerd Font Mono</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
        </prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer>
            <!-- @theme@ -->
            <family>Outfit</family>
            <family>JetBrains Mono NL</family>
        </prefer>
    </alias>
    <alias>
        <family>sans-serif</family>
        <prefer>
            <!-- @theme@ -->
            <family>Outfit</family>
            <family>JetBrains Mono NL</family>
        </prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <!-- @theme@ -->
            <family>JetBrains Mono NL</family>
            <family>Hack</family>
        </prefer>
    </alias>
    <match target="pattern">
        <test name="prgname" compare="eq"><string>kitty</string></test>
        <edit name="family" mode="prepend" binding="same"><string>Symbols Nerd Font Mono</string></edit>
    </match>
    <match target="font">
        <edit name="fontfeatures" mode="append">
            <!-- regular ligatures -->
            <string>liga off</string>
            <!-- discretionary ligatures -->
            <string>dlig off</string>
        </edit>
    </match>
</fontconfig>
